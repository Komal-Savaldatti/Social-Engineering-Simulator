<!DOCTYPE html>
<html>

<head>

    <title>Send Simulation Email</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f6f9;
            text-align:center;
            padding-top:100px;
        }

        .box{
            background:white;
            width:400px;
            margin:auto;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        input{
            width:90%;
            padding:12px;
            margin-top:15px;
        }

        button{
            background:#2563eb;
            color:white;
            border:none;
            padding:12px 20px;
            margin-top:20px;
            border-radius:5px;
            cursor:pointer;
        }

    </style>

</head>

<body>

    <div class="box">

        <h2>Send Simulation Link</h2>

        <form method="POST">

            <input type="email"
                   name="email"
                   placeholder="Enter Target Email"
                   required>

            <br>

            <button type="submit">
                Send Email
            </button>

        </form>

    </div>

</body>

</html>
